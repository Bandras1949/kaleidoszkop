<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TÜZIJÁTÉK – Kaleidoszkóp · © Bánky András</title>
<meta property="og:title" content="TÜZIJÁTÉK – Kaleidoszkóp">
<meta property="og:description" content="Élő tűzijáték a böngészőben. Koppints a hanghoz.">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cim{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.4s ease;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.25) 50%,rgba(0,0,0,.5));color:#F4ECDC}
#cim h1{margin:0;font:600 clamp(40px,9vw,120px) Cinzel,Georgia,serif;letter-spacing:.12em;padding-left:.12em}
#nev{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 4vh);text-align:center;font:clamp(18px,2.4vw,40px) 'Cormorant Garamond',Georgia,serif}
#hang{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14vh);transform:translateX(-50%);padding:10px 18px;border-radius:24px;background:rgba(244,236,220,.14);border:1px solid rgba(244,236,220,.4);color:#F4ECDC;font:italic 18px 'Cormorant Garamond',Georgia,serif;transition:opacity .8s;pointer-events:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cim"><h1>TÜZIJÁTÉK</h1><div id="nev">© Bánky András</div></div>
<div id="hang">Koppints a hanghoz</div>
<script src="./tuzijatek.js?v=71"></script>
<script>
(function () {
  const SEQ = ['Virág', 'Gömb', 'Csápos', 'Kép'];
  const cim = document.getElementById('cim'), hang = document.getElementById('hang');
  const AC = window.AudioContext || window.webkitAudioContext, ac = new AC();
  let idx = 0, on = false, quiet = false, armed = false, pend = false, endT = 0;
  const tz = new window.Tuzijatek(document.getElementById('cv'), () => ({ alakzat: SEQ[idx % SEQ.length], rakéták: 'véletlen', robbanásStílus: 'véletlen', felirat: 'KALEIDOSZKÓP', csíkHossz: 90, robbanásMp: 5, szkenner: false, forgásMp: 29, pontszám: 900, _ac: ac, _hang: on, _zene: on ? 'zene/F-02.mp3' : null, _zeneHang: 0.12 }));
  const showCim = ms => { cim.style.opacity = '1'; clearTimeout(showCim.t); showCim.t = setTimeout(() => cim.style.opacity = '0', ms); };
  const oi = tz.init.bind(tz);
  tz.init = (...a) => {   // egy alakzat köre véget ért → a következő; a negyedik után cím, majd elölről
    if (!quiet && armed) { idx++; pend = true; if (idx % SEQ.length === 0) showCim(4200); }
    return oi(...a);
  };
  tz.start(); armed = true; showCim(3400);
  (function tick() { if (pend) { pend = false; quiet = true; try { tz.sync(); } finally { quiet = false; } } requestAnimationFrame(tick); })();
  const tap = () => {
    if (ac.state !== 'running') ac.resume();
    on = !on; quiet = true; try { tz.sync(); } finally { quiet = false; }
    if (!on) ac.suspend(); else ac.resume();
    hang.textContent = on ? 'Hang be · koppintás: némítás' : 'Koppints a hanghoz';
    hang.style.opacity = '1'; clearTimeout(tap.t); tap.t = setTimeout(() => hang.style.opacity = on ? '0' : '1', 2500);
  };
  window.addEventListener('pointerup', tap);
  document.addEventListener('visibilitychange', () => { if (document.hidden) ac.suspend(); else if (on) ac.resume(); });
})();
</script>
</body>
</html>
