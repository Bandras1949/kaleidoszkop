<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TŰZIJÁTÉK – Látomások · © Bánky András</title>
<meta name="description" content="Élő tűzijáték a képernyőn. Ajándék a Látomások sorozatból. · Live fireworks on your screen. A gift from the Visions series.">
<meta property="og:title" content="TŰZIJÁTÉK · FIREWORKS – Bánky András">
<meta property="og:description" content="Élő tűzijáték a képernyőn. · Live fireworks on your screen.">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cim{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.4s ease;background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.25) 50%,rgba(0,0,0,.5));color:#F4ECDC}
#cim h1{margin:0;font:600 clamp(40px,9vw,120px) Cinzel,Georgia,serif;letter-spacing:.12em;padding-left:.12em}
#nev{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 4vh);text-align:center;font:clamp(18px,2.4vw,40px) 'Cormorant Garamond',Georgia,serif}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cim"><h1></h1><div id="nev">© Bánky András</div></div>
<script src="./tuzijatek.js?v=72"></script>
<script src="./latomas.js?v=1"></script>
<script>
(function () {
  const SEQ = ['Virág', 'Gömb', 'Csápos', 'Kép'];
  const cim = document.getElementById('cim');
  const AC = window.AudioContext || window.webkitAudioContext, ac = new AC();
  let idx = 0, on = false, quiet = false, armed = false, pend = false, tz = null;
  const showCim = ms => { cim.style.opacity = '1'; clearTimeout(showCim.t); showCim.t = setTimeout(() => cim.style.opacity = '0', ms); };
  const sync = () => { quiet = true; try { tz.sync(); } finally { quiet = false; } };
  const L = window.Latomas({
    title: { hu: 'TŰZIJÁTÉK', en: 'FIREWORKS' }, sub: { hu: 'élő tűzijáték a képernyőn', en: 'live fireworks on your screen' },
    bg: '#000000', fg: '#F4ECDC', gold: '#E0C25A', fekvo: true,
    lang(l) { cim.querySelector('h1').textContent = l === 'en' ? 'FIREWORKS' : 'TŰZIJÁTÉK'; },
    start() {
      on = true; ac.resume();
      tz = new window.Tuzijatek(document.getElementById('cv'), () => ({ alakzat: SEQ[idx % SEQ.length], rakéták: 'véletlen', robbanásStílus: 'véletlen', felirat: 'KALEIDOSZKÓP', csíkHossz: 90, robbanásMp: 5, szkenner: false, forgásMp: 29, pontszám: 900, _ac: ac, _hang: on, _zene: on ? 'zene/F-02.mp3' : null, _zeneHang: 0.12 }));
      const oi = tz.init.bind(tz);
      tz.init = (...a) => {   // egy alakzat köre véget ért → a következő; a negyedik után cím és ajánló, majd elölről
        if (!quiet && armed) { idx++; pend = true; if (idx % SEQ.length === 0) { showCim(4200); setTimeout(() => L.cycle(), 4400); } }
        return oi(...a);
      };
      tz.start(); armed = true;
      (function tick() { if (pend) { pend = false; sync(); } requestAnimationFrame(tick); })();
    },
    sound(v) { on = v; if (on) ac.resume(); sync(); if (!on) ac.suspend(); },
    hide() { on = false; sync(); ac.suspend(); }
  });
})();
</script>
</body>
</html>
