<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KÖRFORGÁS – Látomások · © Bánky András</title>
<meta name="description" content="Egy fa, egy pad, egy év. Ajándék a Látomások sorozatból. · One tree, one bench, one year. A gift from the Visions series.">
<meta property="og:title" content="KÖRFORGÁS · CYCLE – Bánky András">
<meta property="og:description" content="Egy fa, egy pad, egy év. · One tree, one bench, one year.">
<meta name="theme-color" content="#3E3329">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#E9DDC4;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cim{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s ease;background:linear-gradient(rgba(36,28,20,.6),rgba(36,28,20,.25) 55%,rgba(36,28,20,.4));color:#F4ECDC}
#cim h1{position:absolute;left:0;right:0;top:14vh;text-align:center;margin:0;font:600 clamp(40px,9vw,120px) Cinzel,Georgia,serif;letter-spacing:.12em;padding-left:.12em}
#nev{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 5vh);text-align:center;font:clamp(18px,2.4vw,40px) 'Cormorant Garamond',Georgia,serif}
.kep{position:fixed;left:5vw;right:5vw;top:12vh;text-align:center;pointer-events:none;opacity:0;transform:translateY(14px);transition:opacity 1.4s ease,transform 1.8s ease;font:italic clamp(28px,5vw,64px)/1.15 'Cormorant Garamond',Georgia,serif;color:#3E3329;text-shadow:0 0 18px rgba(250,246,236,.95),0 0 42px rgba(250,246,236,.8);text-wrap:balance}
.kep.on{opacity:1;transform:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="kep" data-a="47" data-b="80" data-hu="Egy fa. Egy pad." data-en="A tree. A bench."></div>
<div class="kep" data-a="84" data-b="125" data-hu="Nem történik semmi különös." data-en="Nothing out of the ordinary is happening."></div>
<div class="kep" data-a="199" data-b="236" data-hu="Csak eltelt egy év a ki tudja hányból." data-en="Just another year gone, out of who knows how many."></div>
<div id="cim"><h1></h1><div id="nev">© Bánky András</div></div>
<script>
(function () {   // gyorsított év: kb. 1,5 perc alatt telik el (a jelenet ideje K-szor gyorsabban fut)
  const K = 2.6, r = performance.now.bind(performance), z = r();
  performance.now = () => z + (r() - z) * K;
})();
</script>
<script src="./evszakok.js?v=69"></script>
<script src="./evszakok-hang.js?v=19"></script>
<script src="./korforgas.js?v=4"></script>
<script src="./latomas.js?v=1"></script>
<script>
(function () {
  const cim = document.getElementById('cim'), kepek = [...document.querySelectorAll('.kep')];
  const kf = new window.Korforgas(document.getElementById('cv')); kf.want = true;   // a fa és a pad már a nyitókép alatt töltődik
  let wasEnd = false;
  const L = window.Latomas({
    title: { hu: 'KÖRFORGÁS', en: 'CYCLE' }, sub: { hu: 'egy fa, egy pad, egy év', en: 'one tree, one bench, one year' },
    bg: '#3E3329', fg: '#F4ECDC', gold: '#E6C873', fekvo: true,
    ready: () => !!kf.ev.pad,
    lang(l) { cim.querySelector('h1').textContent = l === 'en' ? 'CYCLE' : 'KÖRFORGÁS'; kepek.forEach(k => k.textContent = k.dataset[l]); },
    start() {
      kf.ev.t0 = kf.ev.tl = performance.now(); kf.start();   // az év a koppintással indul
      (function tick() {
        const S = kf.ev.S;
        if (S != null) {
          const end = S > 236 || S < 8;
          cim.style.opacity = end ? '1' : '0';   // cím a kör elején és végén
          kepek.forEach(k => k.classList.toggle('on', S >= +k.dataset.a && S < +k.dataset.b));
          if (S > 236 && !wasEnd) L.cycle();   // egy év letelt: ajánló
          wasEnd = S > 236;
        }
        requestAnimationFrame(tick);
      })();
    },
    sound(on) { kf.setWant(on); if (on) kf.audio(); },
    hide() { kf.setWant(false); }
  });
})();
</script>
</body>
</html>
