<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEDITÁCIÓ – Látomások · © Bánky András</title>
<meta name="description" content="Ködös tó, hangtálak, lassan kibomló mandala. Ajándék a Látomások sorozatból. · Misty lake, singing bowls. A gift from the Visions series.">
<meta property="og:title" content="MEDITÁCIÓ · MEDITATION – Bánky András">
<meta property="og:description" content="Ködös tó, hangtálak. · Misty lake, singing bowls.">
<meta name="theme-color" content="#3A2F25">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#b89c72;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="./meditacio.js?v=8"></script>
<script src="./latomas.js?v=1"></script>
<script>
(function () {
  const md = new window.Meditacio(document.getElementById('cv'));   // a tó képe már a nyitókép alatt töltődik
  const L = window.Latomas({
    title: { hu: 'MEDITÁCIÓ', en: 'MEDITATION' }, sub: { hu: 'ködös tó, hangtálak', en: 'misty lake, singing bowls' },
    bg: '#3A2F25', fg: '#F4ECDC', gold: '#E6C873', fekvo: true,
    ready: () => !!md.ready,
    start() { md.want = true; md.start(); md.audio(); setInterval(() => L.cycle(), 5 * 60 * 1000); },   // ötpercenként ajánló
    sound(on) { md.setWant(on); if (on) md.audio(); },
    hide() { md.setWant(false); }
  });
})();
</script>
</body>
</html>
