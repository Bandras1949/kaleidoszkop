<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MEDITÁCIÓ – Kaleidoszkóp · © Bánky András</title>
<meta property="og:title" content="MEDITÁCIÓ – Kaleidoszkóp">
<meta property="og:description" content="Ködös tó, hangtálak, lassan kibomló mandala. Koppints a hanghoz.">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#b89c72;overflow:hidden;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#cim{position:fixed;inset:0;pointer-events:none;opacity:1;transition:opacity 3s ease;background:linear-gradient(rgba(36,28,20,.55),rgba(36,28,20,.2) 55%,rgba(36,28,20,.4));color:#F4ECDC}
#cim h1{position:absolute;left:0;right:0;top:12vh;text-align:center;margin:0;font:600 clamp(40px,9vw,120px) Cinzel,Georgia,serif;letter-spacing:.12em;padding-left:.12em}
#nev{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 5vh);text-align:center;font:clamp(18px,2.4vw,40px) 'Cormorant Garamond',Georgia,serif}
#hang{position:fixed;right:calc(env(safe-area-inset-right) + 14px);top:calc(env(safe-area-inset-top) + 14px);padding:10px 18px;border-radius:24px;background:rgba(62,51,41,.55);border:1px solid rgba(244,236,220,.5);color:#F4ECDC;font:italic 18px 'Cormorant Garamond',Georgia,serif;transition:opacity .8s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="cim"><h1>MEDITÁCIÓ</h1><div id="nev">© Bánky András</div></div>
<div id="hang">Koppints a hanghoz</div>
<script src="./meditacio.js?v=7"></script>
<script>
(function () {
  const cim = document.getElementById('cim'), hang = document.getElementById('hang');
  const md = new window.Meditacio(document.getElementById('cv'));
  md.want = false; md.start();
  setTimeout(() => cim.style.opacity = '0', 7000);   // a cím az elején, aztán csak a tó
  let on = false;
  const tap = () => {
    on = !on; md.setWant(on); if (on) md.audio();
    hang.textContent = on ? 'Hang be · koppintás: némítás' : 'Koppints a hanghoz';
    hang.style.opacity = '1'; clearTimeout(tap.t); tap.t = setTimeout(() => hang.style.opacity = on ? '0' : '1', 2500);
  };
  window.addEventListener('pointerup', tap);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (md.ac) md.ac.suspend(); } else if (on) md.audio(); });
})();
</script>
</body>
</html>
