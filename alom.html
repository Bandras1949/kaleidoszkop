<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ÁLOM – Látomások · © Bánky András</title>
<meta name="description" content="Foszlányok elalvás előtt. Ajándék a Látomások sorozatból. · Fragments before sleep. A gift from the Visions series.">
<meta property="og:title" content="ÁLOM · DREAM – Bánky András">
<meta property="og:description" content="Foszlányok elalvás előtt. · Fragments before sleep.">
<meta name="theme-color" content="#706C67">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#706C67;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script src="./alom.js?v=3"></script>
<script src="./latomas.js?v=1"></script>
<script>
(function () {
  const EN = [
    'Tomorrow morning at eight. Second floor,\nleft, at the end of the corridor.',
    'The envelope…\nThin? Thick?',
    'The doctor will tell me.',
    'Your insurance number, please. Zero-seven-three… four-one-five…',
    'What if…',
    'This man is getting on my nerves. He turns the pages too loudly.\nHe isn’t even reading, just turning.',
    'Grandma always used to say: “It’s fine for those who are fine with it!”',
    '…seven… three… four…',
    'One summer we lay in the attic, listening to the rain on the roof tiles.',
    'The window is dirty. You can hardly see the linden tree. It would be lovely.',
    'Tomorrow. That’s still far away.',
    '…four…',
    'Someone covered me with a blanket.',
    'silence'
  ];
  const cv = document.getElementById('cv');
  let al = null, iv = 0;
  const L = window.Latomas({
    title: { hu: 'ÁLOM', en: 'DREAM' }, sub: { hu: 'foszlányok elalvás előtt', en: 'fragments before sleep' },
    bg: '#706C67', fg: '#F4ECDC', gold: '#F0D88A', fekvo: true, pauseOnHide: true,
    start(lang) {
      if (al) al.destroy();
      al = window.__alom = new window.Alom(cv, lang === 'en' ? EN : null); al.want = true; al.start();
      clearInterval(iv); iv = setInterval(() => { if (al && al.T >= al.DUR) { clearInterval(iv); setTimeout(() => L.end(), 4000); } }, 500);   // a fekete csend után zárókép
    },
    restart() { this.start(L.lang); },
    sound(on) { if (!al) return; al.setWant(on); if (on) al.audio(); },
    hide() { if (al) al.stop(); },
    resume() { if (!al) return; al.want = true; al.start(); }
  });
})();
</script>
</body>
</html>
